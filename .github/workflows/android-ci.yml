name: Android CI

# Builds the app on every push/PR, and lets you trigger it manually from the Actions tab.
# The resulting debug APK is attached to each run under "Artifacts" — no signing needed,
# just enough to sideload onto your phone and confirm it builds and runs.

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu-latest runners already ship with an Android SDK at
      # $ANDROID_HOME (including cmdline-tools), so there's no separate "set up
      # Android SDK" action needed here — that's what android-actions/setup-android
      # was for, but it tries to install Google's long-removed legacy 'tools'
      # package and fails every time. We just use the SDK that's already there.
      # sdkmanager lives inside the preinstalled SDK but isn't on PATH, so locate it
      # (newest cmdline-tools version wins) instead of assuming it's callable directly.
      - name: Accept SDK licenses and install platform 35 / build-tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK at: $SDK_ROOT"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"; ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle (adds caching automatically)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Single Gradle invocation: there are no unit tests yet, so a separate test
      # step would just compile the same code a second time.
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nzbdroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
